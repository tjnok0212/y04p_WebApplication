<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>フォームの実習</title>
</head>

<body>
<form action="#"  method="post" name="form2" id="form2">
	<table width="500" border="1">
	<caption>
		講座のお申し込みについて
	</caption>
	<tr>
		<th scope="row">お名前</th>
		<td>
			<input type="text" name="yourname" id="yourname" size="20" maxlength="20">
		</td>
	</tr>
	<tr>
		<th scope="row">お電話番号</th>
		<td>
			<input type="text" name="tel1" id="tel1" size="4" maxlength="4">
				-
			<input type="text" name="tel2" id="tel2" size="3" maxlength="3">
				-
			<input type="text" name="tel3" id="tel3" size="4" maxlength="4">
		</td>
	</tr>
	<tr>
		<th scope="row">ご住所</th>
		<td>郵便番号
			<input type="text" name="post1" id="post1" size="3" maxlength="3">
				-
			<input type="text" name="post2" id="post2" size="4" maxlength="4">
		</td>
	</tr>
	<tr>
		<th scope="row">都道府県</th>
		<td>
			<select name="todoufuken" id="todoufuken">
				<option value="nara">奈良</option>
				<option value="osaka">大阪</option>
				<option value="hyogo">兵庫</option>
				<option value="wakayama">和歌山</option>
				<option value="siga">滋賀</option>
				<option value="mie">三重</option>
				<option value="kyoto">京都</option>
			</select>
		</td>
	</tr>
	<tr>
		<th scope="row">それ以降</th>
		<td>
			<input type="text" name="jyusho" id="jyusho" size="30">
		</td>
	</tr>
	<tr>
		<th scope="row">受講校名</th>
		<td>
			<label>
				<input type="radio" name="koumei" id="koumei_0" value="tsuruhashi" checked>
				鶴橋校
			</label>
			<label>
				<input type="radio" name="koumei" id="koumei_1" value="huse">
				布施校
			</label>
			<label>
				<input type="radio" name="koumei" id="koumei_2" value="uehonmachi">
				上本町校
			</label>
		</td>
	</tr>
	<tr>
		<th scope="row">受講コース<br />※複数選択可</th>
		<td>
			<label>
				<input type="checkbox" name="course" id="course_0" value="Word" checked>Word
			</label>
			<label>
				<input type="checkbox" name="course" id="course_1" value="Excel">Excel
			</label>
			<label>
				<input type="checkbox" name="course" id="course_2" value="PowerPoint">PowerPoint
			</label>
			<label>
				<input type="checkbox" name="course" id="course_3" value="Access">Access
			</label>
		</td>
	</tr>
	<tr>
		<th scope="row">ご質問</th>
		<td>
			<textarea name="question" id="question" cols="45" rows="5"></textarea>
		</td>
	</tr>
	<tr>
		<th scope="row">
			<input type="submit" name="soushin_btn" value="送信">
		</th>
		<td>
			<input type="reset" name="reset_btn" value="リセット">
		</td>
	</tr>
	</table>
</form>
</body>
</html>
