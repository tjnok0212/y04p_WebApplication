<body>
<h1>h1タグは、一番大きな見出しを表します。</h1>
<p>pタグは段落を表します。</p>
<p>emタグは文字を強調し、<em>italic</em>で表示されます。<br>
strongタグは文字をより強調し、<strong>bold</strong>で表示されます。</p>
<hr>
<p>この上にhrタグで水平線が引かれています。</p>
<p>&lt;img&gt;と入力するには、実体参照を使用します。</p>
<p>半角スペース&nbsp;を空ける場合も同じです。</p>
</body>
